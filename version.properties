# The library version, shared by all three AARs under libs/.
#
# Committed, unlike environment.properties: a version is a fact about the source,
# so a version in a log or an AAR name maps back to a commit. Bumping it is a
# reviewable change.
#
# Starts with a digit, then letters, digits, dot, underscore and hyphen, with a
# hyphen between other characters rather than at either end — so 1.2.7 and 1.2.7-rc
# both work, and v1.2.7 does not.
# A local build marker goes in environment.properties as `version.suffix`, not here.
version=3.0.0
